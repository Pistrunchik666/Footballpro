<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Football Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0e14;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
}
canvas {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
  width: auto;
  height: auto;
  background: #0d1f14;
  cursor: crosshair;
  margin: auto;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(46, 204, 113, 0.1);
}
#ui {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  color: #ffffff;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 600;
  z-index: 10;
  letter-spacing: 0.5px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  background: rgba(10, 14, 20, 0.7);
  padding: 8px 20px;
  border-radius: 20px;
  border: 1px solid rgba(46, 204, 113, 0.3);
  backdrop-filter: blur(8px);
}
#power {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 240px;
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  overflow: hidden;
  z-index: 10;
  border: 1px solid rgba(46, 204, 113, 0.2);
}
#powerBar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00c853, #69f0ae, #00e676);
  box-shadow: 0 0 12px rgba(0, 200, 83, 0.6);
  transition: width 0.05s ease;
}
#instructions {
  position: absolute;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  color: #e0e0e0;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  z-index: 10;
  letter-spacing: 0.3px;
}
</style>
</head>
<body>
<div id="ui">
  <span id="modeInfo">Уровень: <span id="level">1</span>/100</span>
</div>
<canvas id="game" width="900" height="1100"></canvas>
<div id="power">
  <div id="powerBar"></div>
</div>
<div id="instructions" style="display:none;">Свайп вверх — удар. Длина = сила. Изгиб = закрутка.</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const goalsEl = document.getElementById('goals');
const levelEl = document.getElementById('level');
let level = 1;
const maxLevel = 100;

let score = 0;
let ballRotation = 0;
let goals = 0;
let shots = 0;
let gameOver = false;
let gameMode = 'menu'; // menu, freekick, training, career
let careerTeam = null;
let careerStats = { goals: 0, shots: 0, wins: 0, matches: 0 };
let paused = false;
const topClubs = [
  { name: 'Arsenal', color: '#ef0107', power: 1.05 },
  { name: 'Bayern Munich', color: '#dc052d', power: 1.08 },
  { name: 'Manchester City', color: '#6cabdd', power: 1.06 },
  { name: 'Barcelona', color: '#a50044', power: 1.04 },
  { name: 'Liverpool', color: '#c8102e', power: 1.03 },
  { name: 'PSG', color: '#004170', power: 1.07 },
  { name: 'Real Madrid', color: '#ffffff', power: 1.09 },
  { name: 'Inter Milan', color: '#010e80', power: 1.02 }
];
let menuButtons = [];
let won = false;
let celebrating = false; // Celebrating
let kicking = false;
let shotTimer = 0;
let saving = false;
let saveTime = 0;
let defender = { x: 450, y: 560, active: false };
let netWave = 0;
let celebrateTime = 0;
let showScorer = false;
let scorerName = "Василий Иванов";

// Ball
let ball = {
  x: 450,
  y: 780,
  vx: 0,
  vy: 0,
  radius: 14,
  active: false
};

// Player (striker)
let player = {
  x: 450,
  y: 810
};

// Wall (стенка)
const wall = {
  x: 330,
  y: 460,
  players: 4
};

// Goal
const goal = {
  x: 250,
  y: 90,
  width: 400,
  height: 170
};

// Goalkeeper (very easy, stands in the corner)
let gk = {
  x: goal.x + goal.width / 2,
  y: goal.y + goal.height + 10,
  baseY: goal.y + goal.height + 10,
  speed: 0.2,
  targetX: goal.x + goal.width / 2,
  diving: false,
  diveProgress: 0,
  diveDirection: 0,
  lying: false,
  catching: false,
  catchTime: 0
};

// Aiming
let isAiming = false;
let startX, startY;
let power = 0;
let aimAngle = 0;
let spin = 0;
let ballSpin = 0;
let swipePoints = [];

// Game loop
function update() {
  try {
  if (gameMode === 'menu') {
    document.getElementById('instructions').style.display = 'none';
    document.getElementById('power').style.display = 'none';
    draw();
    requestAnimationFrame(update);
    return;
  } else if (gameMode === 'careerSelect') {
    drawCareerSelect();
    requestAnimationFrame(update);
    return;
  } else {
    document.getElementById('instructions').style.display = 'block';
    document.getElementById('power').style.display = 'block';
  }

  if (ball.active) {
    // Improved ball physics
    ball.x += ball.vx;
    ball.y += ball.vy;
    // Gravity
    ball.vy += 0.16;
    // Air resistance
    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    const drag = 0.997 - speed * 0.00025;
    ball.vx *= drag;
    ball.vy *= drag;
    // Spin effect (Magnus)
    ball.vx += ballSpin * 0.045;
    ballSpin *= 0.988;
    ballRotation += (ball.vx * 0.12) + (ballSpin * 0.35);

    // Wall collision (opaque)
    const wallLeft = wall.x - 10;
    const wallRight = wall.x + wall.players * 28 + 10;
    const wallTop = wall.y - 40;
    const wallBottom = wall.y + 20;
    if (ball.active && ball.x > wallLeft && ball.x < wallRight && ball.y > wallTop && ball.y < wallBottom) {
      // Bounce off wall
      ball.vy = Math.abs(ball.vy) * 0.6 + 1;
      ball.y = wallTop - ball.radius;
      ball.vx *= 0.7;
    }

    // GK catches if close enough
    const diff = getGKDifficulty();
    if (ball.active && Math.abs(ball.x - gk.x) < diff.catchRadius && Math.abs(ball.y - gk.y) < diff.catchRadius + 10 && !gk.lying) {
      gk.catching = true;
      gk.catchTime = 0;
      ball.active = false;
      gameOver = true;
      won = false;
    }

    // Goal — clear and satisfying
    if (ball.x > goal.x + 10 && ball.x < goal.x + goal.width - 10 &&
        ball.y < goal.y + goal.height && ball.y > goal.y) {
      if (gameMode !== 'training') {
        goals++;
        score += 100 + level * 20;
        level = Math.min(level + 1, maxLevel);
        localStorage.setItem('footballProLevel', level);
        localStorage.setItem('footballProScore', score);
        localStorage.setItem('footballProGoals', goals);
      }
      if (gameMode === 'career') careerStats.goals++;
      won = true;
      celebrating = true;
      celebrateTime = 0;
      netWave = 2;
      ball.active = false;
    }

    // Crossbar / posts — 50/50 goal or bounce
    const hitPost = (ball.x < goal.x + 10 && ball.x > goal.x - 10 && ball.y > goal.y && ball.y < goal.y + goal.height) ||
                    (ball.x > goal.x + goal.width - 10 && ball.x < goal.x + goal.width + 10 && ball.y > goal.y && ball.y < goal.y + goal.height);
    const hitCrossbar = ball.y < goal.y + 10 && ball.y > goal.y - 10 && ball.x > goal.x + 15 && ball.x < goal.x + goal.width - 15;

    if ((hitPost || hitCrossbar) && ball.active) {
      if (Math.random() < 0.5) {
        // Goal
        goals++;
        score += 100 + level * 20;
        level = Math.min(level + 1, maxLevel);
        localStorage.setItem('footballProLevel', level);
        localStorage.setItem('footballProScore', score);
        localStorage.setItem('footballProGoals', goals);
        won = true;
        celebrating = true;
        celebrateTime = 0;
        netWave = 2;
        ball.active = false;
      } else {
        // Bounce away
        if (hitCrossbar) {
          ball.vy = Math.abs(ball.vy) * 0.6 + 2;
          ball.y = goal.y - 20;
        } else {
          ball.vx = hitPost && ball.x < goal.x + 20 ? 3 : -3;
          ball.x += ball.vx * 5;
        }
      }
    }

    // Lose only if ball is really stopped far away
    if (Math.abs(ball.vx) < 0.05 && Math.abs(ball.vy) < 0.05 && ball.y > 650) {
      gameOver = true;
      won = false;
    }
  }

  // GK walks a little, then jumps
  const diff = getGKDifficulty();
  if (ball.active && !gk.diving && !gk.lying && !gk.catching) {
    const target = Math.max(goal.x + 40, Math.min(goal.x + goal.width - 40, ball.x));
    if (Math.abs(gk.x - target) > 4) {
      gk.x += Math.sign(target - gk.x) * diff.speed;
    }
    if (ball.y < goal.y + diff.reactDistance && ball.vy < -0.4) {
      gk.diving = true;
      const d = ball.x - gk.x;
      if (d > 25) gk.diveDirection = 1;
      else if (d < -25) gk.diveDirection = -1;
      else gk.diveDirection = Math.random() > 0.5 ? 1 : -1;
      gk.diveProgress = 0;
    }
  }

  if (gk.diving) {
    gk.diveProgress = Math.min(1, gk.diveProgress + Math.max(0.008, diff.diveSpeed));
    if (gk.diveProgress >= 1) {
      gk.diving = false;
      if (won) gk.lying = true;
    }
  }

  // Level 10+: timer and defender
  if (level >= 10 && !ball.active && !gameOver && !celebrating && gameMode === 'freekick') {
    shotTimer += 0.016;
    const timeLimit = level >= 30 ? 4 : 5;
    if (shotTimer > timeLimit) {
      gameOver = true;
      won = false;
    }
    if (!defender.active) {
      defender.x = player.x + 180;
      defender.y = player.y - 200;
      defender.active = true;
      defender.startX = defender.x;
      defender.startY = defender.y;
    }
    // Reach player exactly in 5 seconds
    const progress = Math.min(shotTimer / 5, 1);
    defender.x = defender.startX + (player.x - defender.startX) * progress;
    defender.y = defender.startY + (player.y - 40 - defender.startY) * progress;
  } else if (ball.active || gameOver) {
    shotTimer = 0;
  }

  // Higher levels: player further, less power
  if (level >= 10 && !ball.active && gameMode === 'freekick') {
    player.y = 760 + Math.min(level, 50);
    ball.y = player.y - 30;
  } else if (!ball.active) {
    player.y = 710;
    ball.y = 680;
  }

  if (kicking) {
    kickTime += 0.02;
    if (kickTime > 0.35) kicking = false;
  }

  if (celebrating || showScorer) {
    celebrateTime += 0.02;
    if (celebrating && celebrateTime > 2) {
      celebrating = false;
      showScorer = true;
    }
    if (showScorer && celebrateTime > 30) {
      gameOver = true;
      showScorer = false;
    }
  }

  if (saving) {
    saveTime += 0.016;
    if (saveTime > 1.8) saving = false;
  }

  updateUI();
  if (Math.random() < 0.01) saveProgress();
  draw();
  } catch (e) {
    console.error(e);
  }
  requestAnimationFrame(update);
}

function resetBall() {
  if (gameOver) return;

  ball.active = false;
  ball.x = 450;
  ball.y = 780;
  ball.vx = 0;
  ball.vy = 0;
  ballRotation = 0;
  ballSpin = 0;
  spin = 0;
  isAiming = false;
  kicking = false;
  kickTime = 0;
  swipePoints = [];
  netWave = 0;
  gk.diving = false;
  gk.lying = false;
  gk.catching = false;
  gk.catchTime = 0;
  gk.diveProgress = 0;
  gk.x = goal.x + goal.width / 2;
  defender.active = false;
  shotTimer = 0;
  shots++;
  powerBar.style.width = '0%';
}

function getGKDifficulty() {
  const tier = Math.floor((level - 1) / 5);
  return {
    speed: 0.5 + tier * 0.35,
    catchRadius: 18 + tier * 4,
    diveSpeed: Math.max(0.006, 1/90 - tier * 0.001),
    reactDistance: 90 + tier * 15
  };
}

function updateUI() {
  const modeInfo = document.getElementById('modeInfo');
  if (modeInfo) {
    if (gameMode === 'training') {
      modeInfo.innerHTML = 'ТРЕНИРОВКА';
    } else if (gameMode === 'career' && careerTeam) {
      modeInfo.innerHTML = careerTeam.name + ' | Голы: ' + careerStats.goals;
    } else {
      modeInfo.innerHTML = 'Уровень: <span id="level">' + level + '</span>/100';
    }
  }
  if (levelEl) levelEl.textContent = level;
}

function drawPerson(x, y, color = '#00c853', facingRight = true, isGK = false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1.3, 1.3);
  if (!facingRight) ctx.scale(-1, 1);

  const bounce = isGK ? Math.sin(Date.now() / 280) * 1.2 : 0;
  ctx.translate(0, bounce);

  // Soft shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, 20, 20, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs with better volume
  ctx.strokeStyle = color;
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-8, 0);
  ctx.lineTo(-10, 18);
  ctx.moveTo(8, 0);
  ctx.lineTo(10, 18);
  ctx.stroke();

  // Boots
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(-10, 20, 10, 5, 0, 0, Math.PI * 2);
  ctx.ellipse(10, 20, 10, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Boot highlights
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath();
  ctx.ellipse(-10, 18, 6, 2, 0, 0, Math.PI * 2);
  ctx.ellipse(10, 18, 6, 2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Shorts
  const shorts = color === '#ff6b6b' ? '#8b0000' : (color === '#e74c3c' ? '#6b0000' : '#0d2818');
  ctx.fillStyle = shorts;
  ctx.beginPath();
  ctx.roundRect(-12, -4, 24, 16, 5);
  ctx.fill();

  // Jersey with better gradient
  const body = ctx.createLinearGradient(-14, -46, 14, -6);
  body.addColorStop(0, color);
  body.addColorStop(0.4, color);
  body.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.roundRect(-14, -46, 28, 42, 8);
  ctx.fill();

  // Arms
  ctx.strokeStyle = color;
  ctx.lineWidth = 7;
  const swing = isGK ? Math.sin(Date.now() / 140) * 12 : 0;
  ctx.beginPath();
  ctx.moveTo(-14, -32);
  ctx.lineTo(-26 + swing, -8);
  ctx.moveTo(14, -32);
  ctx.lineTo(26 - swing, -8);
  ctx.stroke();

  // Hands
  ctx.fillStyle = '#e8c4a0';
  ctx.beginPath();
  ctx.arc(-26 + swing, -8, 5, 0, Math.PI * 2);
  ctx.arc(26 - swing, -8, 5, 0, Math.PI * 2);
  ctx.fill();

  // Head with better shading
  const head = ctx.createRadialGradient(-4, -60, 3, 0, -56, 15);
  head.addColorStop(0, '#f5e0c8');
  head.addColorStop(0.6, '#e8c4a0');
  head.addColorStop(1, '#d4a574');
  ctx.fillStyle = head;
  ctx.beginPath();
  ctx.arc(0, -58, 14, 0, Math.PI * 2);
  ctx.fill();

  // Hair
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(0, -64, 14, Math.PI * 1.1, Math.PI * 1.9);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(-5, -58, 2, 2.2, 0, 0, Math.PI * 2);
  ctx.ellipse(5, -58, 2, 2.2, 0, 0, Math.PI * 2);
  ctx.fill();
  // Eye shine
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-4.3, -59, 0.7, 0, Math.PI * 2);
  ctx.arc(5.7, -59, 0.7, 0, Math.PI * 2);
  ctx.fill();

  // Smile
  ctx.strokeStyle = '#8b5a2b';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, -52, 5, 0.3, Math.PI - 0.3);
  ctx.stroke();

  ctx.restore();
}

function drawMenu() {
  // Dark FC-style background
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#0a1628');
  grad.addColorStop(0.6, '#122a4a');
  grad.addColorStop(1, '#0d1f35');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Title
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 48px Inter, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0, 200, 83, 0.4)';
  ctx.shadowBlur = 20;
  ctx.fillText('FOOTBALL PRO', canvas.width / 2, 100);
  ctx.shadowBlur = 0;
  ctx.font = '500 14px Inter, system-ui, sans-serif';
  ctx.fillStyle = '#69f0ae';
  ctx.fillText('ULTIMATE FREE KICK', canvas.width / 2, 130);

  // Mbappé-like player in menu (bigger)
  const px = canvas.width / 2;
  const py = canvas.height / 2 + 20;
  const scale = 2.8;
  
  ctx.save();
  ctx.translate(px, py);
  ctx.scale(scale, scale);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(10, 35, 32, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs (dynamic pose)
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-4, 10);
  ctx.lineTo(-2, 35);
  ctx.moveTo(12, 6);
  ctx.lineTo(30, 25);
  ctx.stroke();

  // Boots (dark with white stripes)
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.ellipse(-2, 37, 14, 7, 0, 0, Math.PI * 2);
  ctx.ellipse(34, 27, 14, 7, 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-10, 35);
  ctx.lineTo(6, 35);
  ctx.moveTo(24, 25);
  ctx.lineTo(42, 29);
  ctx.stroke();

  // Shorts (dark)
  ctx.fillStyle = '#0a0a15';
  ctx.beginPath();
  ctx.roundRect(-18, 2, 36, 20, 5);
  ctx.fill();

  // Jersey - PSG style (dark blue with red)
  const jersey = ctx.createLinearGradient(-22, -60, 22, 5);
  jersey.addColorStop(0, '#1a237e');
  jersey.addColorStop(0.5, '#0d1b4a');
  jersey.addColorStop(1, '#050a20');
  ctx.fillStyle = jersey;
  ctx.beginPath();
  ctx.roundRect(-22, -58, 44, 60, 12);
  ctx.fill();

  // Red stripe
  ctx.fillStyle = '#c0392b';
  ctx.fillRect(-22, -30, 44, 6);

  // Number 7 (Mbappé)
  ctx.fillStyle = 'white';
  ctx.font = 'bold 20px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('7', 0, -18);

  // Arms
  ctx.strokeStyle = '#1a237e';
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(-22, -42);
  ctx.lineTo(-40, -20);
  ctx.moveTo(22, -42);
  ctx.lineTo(42, -28);
  ctx.stroke();

  // Hands
  ctx.fillStyle = '#d4a574';
  ctx.beginPath();
  ctx.arc(-40, -20, 7, 0, Math.PI * 2);
  ctx.arc(42, -28, 7, 0, Math.PI * 2);
  ctx.fill();

  // Head - Mbappé features (lighter skin, short hair)
  const head = ctx.createRadialGradient(-6, -78, 4, 0, -72, 20);
  head.addColorStop(0, '#f5d0b0');
  head.addColorStop(1, '#d4a574');
  ctx.fillStyle = head;
  ctx.beginPath();
  ctx.arc(0, -74, 19, 0, Math.PI * 2);
  ctx.fill();

  // Short dark hair (Mbappé style)
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(0, -82, 18, Math.PI * 1.2, Math.PI * 1.8);
  ctx.fill();

  // Eyes (slightly narrower)
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(-6, -74, 2.8, 2.2, 0, 0, Math.PI * 2);
  ctx.ellipse(6, -74, 2.8, 2.2, 0, 0, Math.PI * 2);
  ctx.fill();
  // Shine
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(-5, -75, 1, 0, Math.PI * 2);
  ctx.arc(7, -75, 1, 0, Math.PI * 2);
  ctx.fill();

  // Eyebrows
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-10, -80);
  ctx.lineTo(-2, -78);
  ctx.moveTo(10, -80);
  ctx.lineTo(2, -78);
  ctx.stroke();

  // Slight smile
  ctx.strokeStyle = '#a04040';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, -66, 5, 0.4, Math.PI - 0.4);
  ctx.stroke();

  ctx.restore();

  // Puma + green-white ball
  ctx.save();
  ctx.translate(px + 140, py + 70);
  ctx.scale(1.2, 1.2);
  // White base
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0, 0, 25, 0, Math.PI * 2);
  ctx.fill();
  // Green panels
  ctx.fillStyle = '#27ae60';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, 25, -0.5, 0.5);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, 25, Math.PI - 0.5, Math.PI + 0.5);
  ctx.closePath();
  ctx.fill();
  // Puma accents
  ctx.fillStyle = '#00c9a7';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, 20, 1.2, 2.0);
  ctx.closePath();
  ctx.fill();
  // Center logo circle
  ctx.fillStyle = '#003366';
  ctx.beginPath();
  ctx.arc(0, 0, 9, 0, Math.PI * 2);
  ctx.fill();
  // Mini cat
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(-2, 1);
  ctx.lineTo(-3, -2);
  ctx.lineTo(-1, -3);
  ctx.lineTo(0, -1);
  ctx.lineTo(2, -4);
  ctx.lineTo(2.5, -1);
  ctx.lineTo(1, 0);
  ctx.lineTo(2, 2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, 25, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // Buttons - FC style
  const btnW = 210;
  const btnH = 65;
  const gap = 20;
  const totalW = btnW * 3 + gap * 2;
  const startX = (canvas.width - totalW) / 2;
  const btnY = canvas.height - 130;

  menuButtons = [
    { x: startX, y: btnY, w: btnW, h: btnH, text: 'КАРЬЕРА', locked: false, mode: 'career' },
    { x: startX + btnW + gap, y: btnY, w: btnW, h: btnH, text: 'ШТРАФНЫЕ', locked: false, mode: 'freekick' },
    { x: startX + (btnW + gap) * 2, y: btnY, w: btnW, h: btnH, text: 'ТРЕНИРОВКА', locked: false, mode: 'training' }
  ];

  menuButtons.forEach(btn => {
    if (!btn.locked) {
      ctx.shadowColor = 'rgba(46,204,113,0.5)';
      ctx.shadowBlur = 18;
    }
    const g = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);
    if (btn.locked) {
      g.addColorStop(0, '#2c3e50');
      g.addColorStop(1, '#1a252f');
    } else {
      g.addColorStop(0, '#2ecc71');
      g.addColorStop(1, '#1e8449');
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 6);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = btn.locked ? '#34495e' : '#27ae60';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = btn.locked ? '#7f8c8d' : '#ffffff';
    ctx.font = '700 15px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(btn.text, btn.x + btn.w / 2, btn.y + 38);
  });
}

function drawCareerSelect() {
  ctx.fillStyle = '#0a0e14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 36px Inter, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('ВЫБЕРИ КОМАНДУ', canvas.width / 2, 80);
  ctx.font = '500 16px Inter, system-ui, sans-serif';
  ctx.fillStyle = '#69f0ae';
  ctx.fillText('Карьера 2026', canvas.width / 2, 110);

  const clubsPerRow = 4;
  const startX = 80;
  const startY = 160;
  const w = 160;
  const h = 70;
  const gap = 20;

  topClubs.forEach((club, i) => {
    const col = i % clubsPerRow;
    const row = Math.floor(i / clubsPerRow);
    const x = startX + col * (w + gap);
    const y = startY + row * (h + gap);

    ctx.fillStyle = club.color;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 10);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = club.color === '#ffffff' ? '#000' : '#fff';
    ctx.font = '700 14px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(club.name, x + w/2, y + 40);
  });
}

function handleCareerClick(x, y) {
  const clubsPerRow = 4;
  const startX = 80;
  const startY = 160;
  const w = 160;
  const h = 70;
  const gap = 20;
  topClubs.forEach((club, i) => {
    const col = i % clubsPerRow;
    const row = Math.floor(i / clubsPerRow);
    const bx = startX + col * (w + gap);
    const by = startY + row * (h + gap);
    if (x >= bx && x <= bx + w && y >= by && y <= by + h) {
      careerTeam = club;
      gameMode = 'career';
      level = 1;
      careerStats = { goals: 0, shots: 0, wins: 0, matches: 0 };
      resetBall();
    }
  });
}

function handleMenuClick(x, y) {
  for (const btn of menuButtons) {
    if (x >= btn.x - 15 && x <= btn.x + btn.w + 15 && y >= btn.y - 15 && y <= btn.y + btn.h + 15) {
      if (!btn.locked) {
        if (btn.mode === 'freekick') {
          gameMode = 'freekick';
          const savedLevel = localStorage.getItem('footballProLevel');
          const savedScore = localStorage.getItem('footballProScore');
          const savedGoals = localStorage.getItem('footballProGoals');
          if (savedLevel) level = parseInt(savedLevel) || 1;
          if (savedScore) score = parseInt(savedScore) || 0;
          if (savedGoals) goals = parseInt(savedGoals) || 0;
        } else if (btn.mode === 'training') {
          gameMode = 'training';
          level = 1;
        } else if (btn.mode === 'career') {
          gameMode = 'careerSelect';
        }
        gameOver = false;
        won = false;
        celebrating = false;
        showScorer = false;
        resetBall();
      }
    }
  }
}

function draw() {
  // Clear with dark green field
  const fieldGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  fieldGrad.addColorStop(0, '#0a1a0f');
  fieldGrad.addColorStop(0.5, '#0d2818');
  fieldGrad.addColorStop(1, '#08140c');
  ctx.fillStyle = fieldGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (gameMode === 'menu') {
    drawMenu();
    return;
  }

  // Save button (further from edge)
  if (gameMode === 'freekick' && !showScorer) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.roundRect(canvas.width - 180, 50, 130, 36, 8);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = '16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Сохранить', canvas.width - 115, 73);
  }

  // Save animation
  if (saving) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    // Spinning documents
    for (let i = 0; i < 3; i++) {
      const angle = saveTime * 6 + i * 2;
      const r = 40;
      const dx = Math.cos(angle) * r;
      const dy = Math.sin(angle) * r;
      ctx.save();
      ctx.translate(cx + dx, cy + dy);
      ctx.rotate(angle);
      ctx.fillStyle = '#fff';
      ctx.fillRect(-12, -16, 24, 32);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      ctx.strokeRect(-12, -16, 24, 32);
      ctx.fillStyle = '#ccc';
      ctx.fillRect(-8, -10, 16, 2);
      ctx.fillRect(-8, -4, 16, 2);
      ctx.fillRect(-8, 2, 12, 2);
      ctx.restore();
    }
    ctx.fillStyle = 'white';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Сохранение...', cx, cy + 80);
  }

  // Main menu button (further from edge)
  if (gameMode === 'freekick' && !showScorer) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.roundRect(50, 50, 140, 36, 8);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = '16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Главное меню', 120, 73);
  }

  // Title
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 22px Inter, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('FOOTBALL PRO', canvas.width / 2, 36);

  // Field lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 2;
  ctx.strokeRect(40, 50, canvas.width - 80, canvas.height - 80);

  // Center line
  ctx.beginPath();
  ctx.moveTo(30, canvas.height / 2);
  ctx.lineTo(canvas.width - 30, canvas.height / 2);
  ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(canvas.width / 2, canvas.height / 2, 55, 0, Math.PI * 2);
  ctx.stroke();

  // Penalty area (near goal at top)
  ctx.strokeRect(goal.x - 60, goal.y + goal.height - 10, goal.width + 120, 100);

  // Goal at top
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 5;
  ctx.strokeRect(goal.x, goal.y, goal.width, goal.height);

  // Posts
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(goal.x, goal.y);
  ctx.lineTo(goal.x, goal.y + goal.height);
  ctx.moveTo(goal.x + goal.width, goal.y);
  ctx.lineTo(goal.x + goal.width, goal.y + goal.height);
  ctx.stroke();

  // Crossbar
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(goal.x, goal.y);
  ctx.lineTo(goal.x + goal.width, goal.y);
  ctx.stroke();

  // Net (with wave animation on goal)
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1;
  const wave = netWave * Math.sin(Date.now() / 80) * 8;
  for (let i = 0; i < 9; i++) {
    const offset = Math.sin(i * 0.8 + Date.now() / 100) * wave;
    ctx.beginPath();
    ctx.moveTo(goal.x + i * (goal.width / 9) + offset * 0.3, goal.y);
    ctx.quadraticCurveTo(
      goal.x + i * (goal.width / 9) + offset,
      goal.y + goal.height / 2,
      goal.x + i * (goal.width / 9) + offset * 0.2,
      goal.y + goal.height
    );
    ctx.stroke();
  }
  for (let i = 0; i < 6; i++) {
    const offset = Math.sin(i * 0.6 + Date.now() / 90) * wave * 0.7;
    ctx.beginPath();
    ctx.moveTo(goal.x, goal.y + i * (goal.height / 6));
    ctx.quadraticCurveTo(
      goal.x + goal.width / 2 + offset,
      goal.y + i * (goal.height / 6),
      goal.x + goal.width,
      goal.y + i * (goal.height / 6)
    );
    ctx.stroke();
  }

  // Decay net wave
  if (netWave > 0) netWave *= 0.98;

  // Wall position varies by level
  if (level > 1) {
    wall.y = 420 + (level % 5) * 15;
    wall.x = 300 + (level % 3) * 20;
  }
  // Opaque wall background
  ctx.fillStyle = 'rgba(15, 15, 25, 0.9)';
  ctx.fillRect(wall.x - 10, wall.y - 55, wall.players * 28 + 20, 75);
  // Wall players
  for (let i = 0; i < wall.players; i++) {
    drawPerson(wall.x + i * 28, wall.y, '#c0392b', true);
  }

  // Defender on level 10+
  if (level >= 10 && defender.active && !ball.active) {
    drawPerson(defender.x, defender.y, '#e67e22', true);
  }

  // Timer
  if (level >= 10 && !ball.active && !gameOver && shotTimer > 0) {
    const timeLeft = Math.max(0, 5 - shotTimer).toFixed(1);
    ctx.fillStyle = timeLeft < 2 ? '#ff5252' : '#ffffff';
    ctx.font = '700 22px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Время: ' + timeLeft, canvas.width / 2, 70);
  }

  // Striker
  if (kicking) {
    ctx.save();
    ctx.translate(player.x, player.y);
    const kickAngle = Math.sin(kickTime * 18) * 0.9;
    ctx.rotate(kickAngle);
    drawPerson(0, 0, '#00c853', true, false);
    // Extended kick leg
    ctx.strokeStyle = '#3498db';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(6, -2);
    ctx.lineTo(28, -18);
    ctx.stroke();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.ellipse(30, -18, 7, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else if (!celebrating) {
    drawPerson(player.x, player.y, '#00c853', true);
  }

  // Goalkeeper
  if (gk.catching) {
    // Caught the ball — stands and holds it
    ctx.save();
    ctx.translate(gk.x, gk.baseY - 5);
    drawPerson(0, 0, '#ff6b6b', true, false);
    // Arms up holding ball
    ctx.strokeStyle = '#ff6b6b';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-8, -28);
    ctx.lineTo(0, -55);
    ctx.moveTo(8, -28);
    ctx.lineTo(0, -55);
    ctx.stroke();
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(0, -58, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  } else if (gk.lying || (won && !ball.active)) {
    // Sad lying after conceding a goal
    ctx.save();
    ctx.translate(gk.x + (gk.diveDirection || 1) * 40, gk.baseY + 18);
    ctx.rotate((gk.diveDirection || 1) * 1.4);
    drawPerson(0, 0, '#ff6b6b', true, false);
    // Sad face overlay
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(-3, -50, 1.2, 0, Math.PI * 2);
    ctx.arc(3, -50, 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -42, 3, Math.PI + 0.3, -0.3);
    ctx.stroke();
    ctx.restore();
  } else if (gk.diving) {
    // Realistic jump phases
    const t = gk.diveProgress;
    let jumpY, moveX, rot;
    if (t < 0.2) {
      // Crouch + takeoff
      const p = t / 0.2;
      jumpY = 5 * (1 - p) - 15 * p;
      moveX = gk.diveDirection * 10 * p;
      rot = gk.diveDirection * 0.2 * p;
    } else if (t < 0.65) {
      // Flight arc
      const p = (t - 0.2) / 0.45;
      jumpY = -15 - 55 * Math.sin(p * Math.PI);
      moveX = gk.diveDirection * (10 + 80 * p);
      rot = gk.diveDirection * (0.2 + 1.0 * p);
    } else {
      // Landing
      const p = (t - 0.65) / 0.35;
      jumpY = -8 * (1 - p);
      moveX = gk.diveDirection * 90;
      rot = gk.diveDirection * (1.2 * (1 - p * 0.5));
    }
    ctx.save();
    ctx.translate(gk.x + moveX, gk.baseY + jumpY);
    ctx.rotate(rot);
    drawPerson(0, 0, '#ff6b6b', true, false);
    ctx.strokeStyle = '#ff6b6b';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-6, -18);
    ctx.lineTo(-28, 2);
    ctx.moveTo(6, -18);
    ctx.lineTo(28, 2);
    ctx.stroke();
    ctx.restore();
  } else {
    // Standing ready
    drawPerson(gk.x, gk.y, '#ff6b6b', true, true);
  }

  // Ball - Puma style with alternating green-white
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ballRotation);
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(0, ball.radius + 5, ball.radius * 0.75, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Base white
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
  ctx.fill();
  
  // Green panels (classic soccer ball style)
  ctx.fillStyle = '#27ae60';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, ball.radius, -Math.PI * 0.15, Math.PI * 0.15);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, ball.radius, Math.PI * 0.85, Math.PI * 1.15);
  ctx.closePath();
  ctx.fill();
  
  // Puma blue-green accent panels
  ctx.fillStyle = '#00c9a7';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, ball.radius * 0.85, Math.PI * 0.35, Math.PI * 0.65);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, ball.radius * 0.85, Math.PI * 1.35, Math.PI * 1.65);
  ctx.closePath();
  ctx.fill();
  
  // Center Puma logo area (simple leaping cat approximation)
  ctx.fillStyle = '#003366';
  ctx.beginPath();
  ctx.arc(0, 0, ball.radius * 0.35, 0, Math.PI * 2);
  ctx.fill();
  
  // Simple Puma cat silhouette
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(-4, 2);
  ctx.lineTo(-6, -4);
  ctx.lineTo(-2, -6);
  ctx.lineTo(0, -2);
  ctx.lineTo(3, -8);
  ctx.lineTo(5, -3);
  ctx.lineTo(2, 0);
  ctx.lineTo(4, 4);
  ctx.lineTo(0, 3);
  ctx.closePath();
  ctx.fill();
  
  // Outline
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
  ctx.stroke();
  
  ctx.restore();

  if (isAiming) {
    // Gray swipe line
    if (swipePoints.length > 1) {
      ctx.strokeStyle = 'rgba(180, 180, 180, 0.7)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(swipePoints[0].x, swipePoints[0].y);
      for (let i = 1; i < swipePoints.length; i++) {
        ctx.lineTo(swipePoints[i].x, swipePoints[i].y);
      }
      ctx.stroke();
    }

    // Indicators
    ctx.fillStyle = Math.abs(spin) > 0.1 ? '#00ffff' : 'rgba(255, 255, 0, 0.9)';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('Сила: ' + Math.round(power) + '%', ball.x + 25, ball.y - 25);
    const spinText = spin > 0.2 ? '→ Закрутка' : spin < -0.2 ? '← Закрутка' : 'Прямой удар';
    ctx.fillText(spinText, ball.x + 25, ball.y - 5);
  }

  // Celebration animation - same model
  if (celebrating) {
    const jump = Math.sin(celebrateTime * 8) * 25;
    ctx.save();
    ctx.translate(player.x, player.y + jump);
    drawPerson(0, 0, '#00c853', true, false);
    ctx.restore();

    // "ГОЛ!" text with pulse
    const scale = 1 + Math.sin(celebrateTime * 10) * 0.1;
    ctx.save();
    ctx.translate(canvas.width / 2, 160);
    ctx.scale(scale, scale);
    ctx.fillStyle = '#00e676';
    ctx.font = '800 48px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ГОЛ!', 0, 0);
    ctx.restore();
  }

  // Scorer screen
  if (showScorer) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('ГОЛ!', canvas.width / 2, canvas.height / 2 - 80);
    ctx.fillStyle = 'white';
    ctx.font = '24px Arial';
    ctx.fillText('Забил: ' + scorerName, canvas.width / 2, canvas.height / 2 - 30);
    ctx.fillText('Уровень ' + (level - 1) + ' пройден!', canvas.width / 2, canvas.height / 2 + 10);

    // Next level button
    nextLevelBtn = { x: canvas.width/2 - 100, y: canvas.height/2 + 50, w: 200, h: 55 };
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.roundRect(nextLevelBtn.x, nextLevelBtn.y, nextLevelBtn.w, nextLevelBtn.h, 12);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = 'bold 20px Arial';
    ctx.fillText(level + ' уровень', nextLevelBtn.x + nextLevelBtn.w/2, nextLevelBtn.y + 35);
  } else {
    nextLevelBtn = null;
  }

  // Game over message
  if (gameOver && !showScorer) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = won ? '#2ecc71' : '#e74c3c';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(won ? 'ГОЛ!' : 'ПРОИГРЫШ', canvas.width / 2, canvas.height / 2 - 40);
    ctx.fillStyle = 'white';
    ctx.font = '22px Arial';
    ctx.fillText(won ? 'Ты забил!' : 'Попробуй ещё раз', canvas.width / 2, canvas.height / 2 + 10);

    // Restart button
    restartBtn = { x: canvas.width/2 - 110, y: canvas.height/2 + 50, w: 220, h: 55 };
    ctx.fillStyle = '#3498db';
    ctx.beginPath();
    ctx.roundRect(restartBtn.x, restartBtn.y, restartBtn.w, restartBtn.h, 12);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = 'bold 18px Arial';
    ctx.fillText('Начать заново (' + level + ' уровень)', restartBtn.x + restartBtn.w/2, restartBtn.y + 35);
  } else {
    restartBtn = null;
  }
}

// Mouse / Touch controls — swipe to aim and spin
function startAim(x, y) {
  if (gameMode === 'careerSelect') {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    handleCareerClick(x * scaleX, y * scaleY);
    return;
  }
  // Main menu button in freekick mode
  if (gameMode === 'freekick' && !showScorer) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const sx = x * scaleX;
    const sy = y * scaleY;
    // Save button
    if (sx >= canvas.width - 185 && sx <= canvas.width - 45 && sy >= 45 && sy <= 90) {
      saveProgress();
      saving = true;
      saveTime = 0;
      return;
    }
    if (sx >= 45 && sx <= 195 && sy >= 45 && sy <= 90) {
      // Save progress
      localStorage.setItem('footballProLevel', level);
      localStorage.setItem('footballProScore', score);
      localStorage.setItem('footballProGoals', goals);
      gameMode = 'menu';
      gameOver = false;
      won = false;
      celebrating = false;
      showScorer = false;
      ball.active = false;
      return;
    }
  }
  if (gameMode === 'menu') {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    handleMenuClick(x * scaleX, y * scaleY);
    return;
  }
  if (showScorer && nextLevelBtn) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const sx = x * scaleX;
    const sy = y * scaleY;
    if (sx >= nextLevelBtn.x && sx <= nextLevelBtn.x + nextLevelBtn.w &&
        sy >= nextLevelBtn.y && sy <= nextLevelBtn.y + nextLevelBtn.h) {
      showScorer = false;
      celebrating = false;
      gameOver = false;
      won = false;
      resetBall();
      return;
    }
  }
  if (gameOver && restartBtn && !showScorer) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const sx = x * scaleX;
    const sy = y * scaleY;
    if (sx >= restartBtn.x && sx <= restartBtn.x + restartBtn.w &&
        sy >= restartBtn.y && sy <= restartBtn.y + restartBtn.h) {
      gameOver = false;
      won = false;
      celebrating = false;
      showScorer = false;
      resetBall();
      return;
    }
  }
  if (ball.active || gameOver || celebrating || showScorer) return;
  isAiming = true;
  startX = x;
  startY = y;
  swipePoints = [{x, y}];
  power = 0;
  spin = 0;
}

function updateAim(x, y) {
  if (!isAiming || gameOver) return;
  swipePoints.push({x, y});
  if (swipePoints.length > 40) swipePoints.shift();

  const dx = x - startX;
  const dy = y - startY;
  // Power = length of the swipe line
  power = Math.min(Math.sqrt(dx*dx + dy*dy) / 1.6, 100);
  aimAngle = Math.atan2(dy, dx);

  // Calculate spin only if the swipe is clearly curved
  if (swipePoints.length > 8) {
    let curve = 0;
    for (let i = 2; i < swipePoints.length; i++) {
      const p1 = swipePoints[i-2];
      const p2 = swipePoints[i-1];
      const p3 = swipePoints[i];
      const cross = (p2.x - p1.x) * (p3.y - p2.y) - (p2.y - p1.y) * (p3.x - p2.x);
      curve += cross;
    }
    // Only strong, clear curve gives spin
    spin = Math.abs(curve) > 20000 ? Math.max(-1, Math.min(1, curve / 25000)) : 0;
  }
  powerBar.style.width = power + '%';
}

function endAim() {
  if (!isAiming) return;
  isAiming = false;
  if (power > 5) {
    // Faster shot, no bounce back
    const levelPenalty = Math.min(level * 0.03, 2);
    const shotPower = 7 + (power / 100) * 11 - levelPenalty;
    ball.vx = Math.cos(aimAngle) * shotPower;
    ball.vy = Math.sin(aimAngle) * shotPower - 0.5;
    ballSpin = spin * 1.8;
    ball.active = true;
    kicking = true;
    kickTime = 0;
    score += Math.floor(power / 4);
  }
  powerBar.style.width = '0%';
  swipePoints = [];
}

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  startAim(e.clientX - rect.left, e.clientY - rect.top);
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  updateAim(e.clientX - rect.left, e.clientY - rect.top);
});

canvas.addEventListener('mouseup', endAim);
canvas.addEventListener('mouseleave', endAim);

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const x = touch.clientX - rect.left;
  const y = touch.clientY - rect.top;
  if (gameMode === 'menu') {
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    handleMenuClick(x * scaleX, y * scaleY);
    return;
  }
  startAim(x, y);
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  updateAim(touch.clientX - rect.left, touch.clientY - rect.top);
});

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  endAim();
});

// Auto-save on exit
function saveProgress() {
  localStorage.setItem('footballProLevel', level);
  localStorage.setItem('footballProScore', score);
  localStorage.setItem('footballProGoals', goals);
}
window.addEventListener('beforeunload', saveProgress);
window.addEventListener('pagehide', saveProgress);

// Start
try {
  resetBall();
  update();
} catch(e) {
  console.error(e);
  document.body.innerHTML = '<div style="color:white;text-align:center;padding:40px;">Ошибка загрузки. Обнови страницу.</div>';
}
</script>
</body>
</html>
